<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>麦麦，战斗吧！</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-Crw3nj1T.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BP9hofMD.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer">
      <div id="top-bar">
        <button id="mode-select" class="top-btn">VS MODE</button>
        <button id="start-btn" class="top-btn primary">START</button>
      </div>
      <div class="hud">
        <div class="health-group left">
          <div class="player-avatar blue" id="avatar-p1">
            <div class="avatar-img titan"></div>
            <div class="player-info">
              <span class="player-name">TITAN</span>
              <button id="mode-p1" class="control-btn player">PLAYER</button>
            </div>
          </div>
          <div class="bar"><div id="hp-p1" class="fill"></div></div>
        </div>
        <div class="round" id="round-info">
          <div>VS</div>
          <div id="level-tag" class="level-tag hidden">LV.1</div>
        </div>
        <div class="health-group right">
          <div class="bar"><div id="hp-p2" class="fill"></div></div>
          <div class="player-avatar red" id="avatar-p2">
            <div class="avatar-img blade"></div>
            <div class="player-info">
              <button id="mode-p2" class="control-btn player">PLAYER</button>
              <span class="player-name">BLADE</span>
            </div>
          </div>
        </div>
      </div>
      <div id="message" class="message hidden">
        <div class="ko">K.O.</div>
        <div class="winner">PLAYER <span id="winner-id">1</span> WINS</div>
      </div>
      <div id="story-message" class="story-message hidden">
        <div class="story-title">LEVEL CLEAR</div>
        <div class="story-sub">NEXT BATTLE</div>
      </div>
      <div id="pause-overlay" class="pause-overlay hidden">
        <div class="pause-menu">
          <div class="pause-title">PAUSED</div>
          <button id="resume-btn" class="pause-btn">RESUME</button>
          <button id="restart-pause-btn" class="pause-btn">RESTART</button>
          <button id="quit-btn" class="pause-btn">QUIT TO MENU</button>
        </div>
      </div>
      <div class="controls">
        <div class="panel">
          <strong class="blue">TITAN 重装</strong>
          <span>A / D 移动</span>
          <span>W 跳跃</span>
          <span>J 巨剑斩击</span>
          <span>K 盾防</span>
        </div>
        <div class="panel center">
          <span class="versus">VS</span>
        </div>
        <div class="panel">
          <strong class="red">BLADE 迅捷</strong>
          <span>&larr; / &rarr; 移动</span>
          <span>&uarr; 跳跃</span>
          <span>1 双刀连击</span>
          <span>2 闪避</span>
        </div>
      </div>
      <div id="mobile-controls">
        <div id="joystick-zone">
          <div id="joystick-base">
            <div id="joystick-stick"></div>
          </div>
        </div>
        <div id="action-buttons">
          <button id="btn-jump" class="action-btn jump">JUMP</button>
          <button id="btn-attack" class="action-btn attack">ATK</button>
          <button id="btn-guard" class="action-btn guard">DEF</button>
        </div>
        <button id="mobile-switch" class="switch-btn">CONTROL: P1</button>
        <button id="mobile-pause" class="mobile-pause-btn">II</button>
      </div>
    </div>
  </div>
</body>
</html>
